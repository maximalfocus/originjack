name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose verification boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The same command a contributor runs locally. There is deliberately no separate
      # CI recipe: one gate, one place to keep it green.
      - name: ./scripts/demo.sh
        run: ./scripts/demo.sh
