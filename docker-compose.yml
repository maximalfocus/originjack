name: originjack

# Every service in this file is a fictional demonstration service on a hermetic,
# egress-less container network. Nothing is published to the host, nothing resolves on
# the public internet, and nothing contacts a real system.

x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  # Lets the unprivileged account bind :443 without CAP_NET_BIND_SERVICE, so the origins
  # are real origins (no port suffix) while the container keeps every capability dropped.
  sysctls:
    net.ipv4.ip_unprivileged_port_start: "0"

services:
  # The secure API. Default service, and the reference every later contrast is measured
  # against: strict exact-match origin allowlist, no misconfiguration shape.
  api:
    <<: *hardening
    image: originjack:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      ORIGINJACK_ALLOWED_ORIGINS: "https://app.meridianpay.example"
      ORIGINJACK_SESSION_SAMESITE: "none"
    command:
      - uvicorn
      - originjack.secure:app
      - --host=0.0.0.0
      - --port=443
      - --no-access-log
      - --ssl-certfile=/certs/api.meridianpay.example/cert.pem
      - --ssl-keyfile=/certs/api.meridianpay.example/key.pem
    networks:
      demo:
        aliases: ["api.meridianpay.example"]
    healthcheck:
      test:
        ["CMD", "python", "-m", "originjack.healthcheck", "https://api.meridianpay.example/healthz"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  # The legitimate first-party application — the one allowlisted origin.
  app:
    <<: *hardening
    image: originjack:local
    pull_policy: never
    environment:
      ORIGINJACK_STATIC_ROOT: /app/web/app
    command:
      - uvicorn
      - originjack.staticweb:app
      - --host=0.0.0.0
      - --port=443
      - --no-access-log
      - --ssl-certfile=/certs/app.meridianpay.example/cert.pem
      - --ssl-keyfile=/certs/app.meridianpay.example/key.pem
    networks:
      demo:
        aliases: ["app.meridianpay.example"]
    healthcheck:
      test:
        ["CMD", "python", "-m", "originjack.healthcheck", "https://app.meridianpay.example/healthz"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  # An unrelated third party. Not an attacker: simply an origin the allowlist does not
  # name, which is the only qualification needed for the browser to withhold a response.
  partner:
    <<: *hardening
    image: originjack:local
    pull_policy: never
    environment:
      ORIGINJACK_STATIC_ROOT: /app/web/partner
    command:
      - uvicorn
      - originjack.staticweb:app
      - --host=0.0.0.0
      - --port=443
      - --no-access-log
      - --ssl-certfile=/certs/partner.othercorp.example/cert.pem
      - --ssl-keyfile=/certs/partner.othercorp.example/key.pem
    networks:
      demo:
        aliases: ["partner.othercorp.example"]
    healthcheck:
      test:
        ["CMD", "python", "-m", "originjack.healthcheck", "https://partner.othercorp.example/healthz"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  # =====================================================================================
  # OPT-IN ONLY — deliberately insecure educational material below this line.
  #
  # Starting either service takes two deliberate actions: the `vulnerable` Compose
  # profile, and the acknowledgement ALLOW_VULNERABLE_DEMO=true. The second is checked by
  # the application itself, not only here, so the gate does not disappear the moment
  # somebody bypasses Compose. Neither service is reachable from the host, and neither can
  # reach anything outside this network.
  # =====================================================================================

  # The vulnerable API. Identical routes, domain, sessions, and payloads to `api`; the
  # only difference is the CORS policy object it is built with.
  legacy-api:
    <<: *hardening
    image: originjack:local
    pull_policy: never
    profiles: ["vulnerable"]
    environment:
      ALLOW_VULNERABLE_DEMO: ${ALLOW_VULNERABLE_DEMO:-}
      ORIGINJACK_ALLOWED_ORIGINS: "https://app.meridianpay.example"
      ORIGINJACK_VULNERABLE_SHAPE: "reflect"
      ORIGINJACK_SESSION_SAMESITE: "none"
    command:
      - uvicorn
      # A factory, so the ALLOW_VULNERABLE_DEMO gate fires at start-up and the module
      # stays importable by the tests that prove the gate works.
      - originjack.vulnerable:build
      - --factory
      - --host=0.0.0.0
      - --port=443
      - --no-access-log
      - --ssl-certfile=/certs/legacy-api.meridianpay.example/cert.pem
      - --ssl-keyfile=/certs/legacy-api.meridianpay.example/key.pem
    networks:
      demo:
        aliases: ["legacy-api.meridianpay.example"]
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - originjack.healthcheck
        - https://legacy-api.meridianpay.example/healthz
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  # The attacker's page. An unrelated site the victim happens to visit.
  attacker:
    <<: *hardening
    image: originjack:local
    pull_policy: never
    profiles: ["vulnerable"]
    environment:
      ORIGINJACK_STATIC_ROOT: /app/web/attacker
    command:
      - uvicorn
      - originjack.staticweb:app
      - --host=0.0.0.0
      - --port=443
      - --no-access-log
      - --ssl-certfile=/certs/promo.attacker.example/cert.pem
      - --ssl-keyfile=/certs/promo.attacker.example/key.pem
    networks:
      demo:
        aliases: ["promo.attacker.example"]
    healthcheck:
      test:
        ["CMD", "python", "-m", "originjack.healthcheck", "https://promo.attacker.example/healthz"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  # The verification boundary. Runs lint, types, unit tests, and the HTTPS boundary
  # tests from inside the hermetic network. Local runs and CI invoke exactly this.
  verify:
    <<: *hardening
    image: originjack:local
    pull_policy: never
    profiles: ["verify"]
    environment:
      ORIGINJACK_API_BASE: "https://api.meridianpay.example"
      ORIGINJACK_APP_BASE: "https://app.meridianpay.example"
      ORIGINJACK_VULNERABLE_API_BASE: "https://legacy-api.meridianpay.example"
      ORIGINJACK_CA_BUNDLE: /certs/ca/ca.pem
    command: ["bash", "scripts/verify.sh"]
    networks:
      demo: {}
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy

  # The browser harness. The only image carrying Chromium, built FROM the runtime stage
  # so it shares the identical demo CA. This is where the project stops asserting headers
  # and starts observing what a browser does with them.
  browser:
    <<: *hardening
    image: originjack-browser:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: browser
    profiles: ["browser"]
    # Chromium crashes on Docker's default 64MB /dev/shm.
    shm_size: "1gb"
    environment:
      ORIGINJACK_API_BASE: "https://api.meridianpay.example"
      ORIGINJACK_APP_BASE: "https://app.meridianpay.example"
      ORIGINJACK_PARTNER_BASE: "https://partner.othercorp.example"
      ORIGINJACK_VULNERABLE_API_BASE: "https://legacy-api.meridianpay.example"
      ORIGINJACK_ATTACKER_BASE: "https://promo.attacker.example"
      ORIGINJACK_CA_BUNDLE: /certs/ca/ca.pem
      ORIGINJACK_ARTIFACTS: /artifacts
      HOME: /home/originjack
    # A named volume, not a tmpfs: the artifacts have to outlive the container so the
    # transcript and screenshots can be copied to the host after the run.
    volumes:
      - artifacts:/artifacts
    # Chromium needs a roomier scratch area than the other services, and its own writable
    # HOME for the NSS trust store the demo CA is imported into.
    tmpfs:
      - /tmp:rw,nosuid,size=512m,mode=1777
      - /home/originjack:rw,nosuid,size=256m,mode=0700,uid=10001,gid=10001
    command: ["bash", "scripts/verify-browser.sh"]
    networks:
      demo: {}
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
      partner:
        condition: service_healthy

networks:
  demo:
    # No egress. The demo's containers can reach each other and nothing else.
    internal: true

volumes:
  artifacts:
